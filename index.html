<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <style>
        body { font-family: Arial; background: #f3f4f6; text-align: center; margin-top: 100px; }
        .box { background: white; padding: 20px; border-radius: 8px; width: 330px; margin: auto; border: 1px solid #ccc; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; }
        button { width: 95%; background: #4F46E5; color: white; padding: 10px; font-weight: bold; cursor: pointer; border: none; }
        #result { margin-top: 15px; background: #d1fae5; padding: 10px; display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>URL Shortener Project ✂️</h2>
        <p>Enter long URL:</p>
        <input type="text" id="url" placeholder="https://example.com/link">
        <button id="btn" onclick="shorten()">Shorten</button>
        
        <div id="result">
            <b style="color: green;">Success!</b><br>
            <a href="#" id="link" target="_blank"></a><br><br>
            <button style="background:gray; width:auto; padding:5px;" onclick="copy()">Copy</button>
        </div>
    </div>

    <script>
        var API_URL = "http://127.0.0.1:8000";

        function shorten() {
            var urlInput = document.getElementById('url').value;
            var btn = document.getElementById('btn');
            var resultBox = document.getElementById('result');
            var linkTag = document.getElementById('link');

            if (urlInput == "") {
                alert("Please enter a link!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Connecting...";

            // Student style chain logic
            fetch(API_URL + "/shorten", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: urlInput })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.short_code) {
                    var fullShortLink = API_URL + "/" + data.short_code;
                    linkTag.href = fullShortLink;
                    linkTag.innerText = fullShortLink;
                    resultBox.style.display = 'block';
                } else {
                    alert("API Error");
                }
                btn.disabled = false;
                btn.innerText = "Shorten";
            })
            .catch(function(err) {
                alert("Backend offline!");
                btn.disabled = false;
                btn.innerText = "Shorten";
            });
        }

        function copy() {
            var text = document.getElementById('link').innerText;
            navigator.clipboard.writeText(text);
            alert("Copied!");
        }
    </script>
</body>
</html>
